name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,geo,api,dev]" pdfplumber beautifulsoup4
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Licence register
        run: sailab licences check

  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sailab
          POSTGRES_PASSWORD: sailab
          POSTGRES_DB: sailab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sailab" --health-interval 5s --health-retries 20
    env:
      SAILAB_DATABASE_URL: postgresql+psycopg://sailab:sailab@localhost:5432/sailab
      SAILAB_DATA_DIR: /tmp/sailab-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[api,dev]"
      - name: Twin run on a tiny synthetic cube, synced into PostGIS
        run: |
          sailab synthetic generate --name tiny --resolution 3000 --years 2023,2025
          sailab twin run 2025-08-28 --cube tiny --members 0
          sailab db sync --cube tiny
          python -c "from sqlalchemy import create_engine, text; import os; e = create_engine(os.environ['SAILAB_DATABASE_URL']); c = e.connect(); print('road pieces with PostGIS geometry:', c.execute(text('select count(*) from road_risk where geom is not null')).scalar())"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

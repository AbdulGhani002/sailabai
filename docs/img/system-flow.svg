<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="How SailabAI turns free data into flood forecasts" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>How SailabAI turns free data into flood forecasts</title>
  <rect width="760" height="470" rx="12" fill="#fcfcfb"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#898781"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0b0b0b">How SailabAI turns free data into flood forecasts</text>
  <g fill="none" stroke="#898781" stroke-width="1.25" marker-end="url(#a)">
    <path d="M104 124V184"/><path d="M280 124V184"/><path d="M456 124V184"/><path d="M632 124V184"/>
    <path d="M302 212H414"/><path d="M544 240V284"/><path d="M544 340V384"/><path d="M192 240V384"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="24" y="72" width="160" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="104" y="94" font-weight="600" fill="#0b0b0b">Radar images</text>
    <text x="104" y="112" font-size="11.5" fill="#52514e">Sentinel-1, 3-4 days</text>
    <rect x="200" y="72" width="160" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="280" y="94" font-weight="600" fill="#0b0b0b">Terrain</text>
    <text x="280" y="112" font-size="11.5" fill="#52514e">DEM, HAND, land cover</text>
    <rect x="376" y="72" width="160" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="456" y="94" font-weight="600" fill="#0b0b0b">Rainfall</text>
    <text x="456" y="112" font-size="11.5" fill="#52514e">IMERG, ECMWF forecast</text>
    <rect x="552" y="72" width="160" height="52" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="632" y="94" font-weight="600" fill="#0b0b0b">River flow</text>
    <text x="632" y="112" font-size="11.5" fill="#52514e">GloFAS, FFD gauges</text>
    <rect x="82" y="184" width="220" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="192" y="208" font-weight="600" fill="#0b0b0b">Model 1: flood mapping</text>
    <text x="192" y="226" font-size="11.5" fill="#52514e">Otsu, U-Net, TerraMind-small</text>
    <rect x="414" y="184" width="260" height="56" rx="8" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/>
    <text x="544" y="208" font-weight="600" fill="#0b0b0b">Model 2: flood forecast</text>
    <text x="544" y="226" font-size="11.5" fill="#52514e">next pass and +1 to +7 days</text>
    <rect x="414" y="284" width="260" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="544" y="308" font-weight="600" fill="#0b0b0b">Confidence and exposure</text>
    <text x="544" y="326" font-size="11.5" fill="#52514e">roads, buildings, people, as ranges</text>
    <rect x="120" y="384" width="520" height="56" rx="8" fill="#ffffff" stroke="#c3c2b7"/>
    <text x="380" y="408" font-weight="600" fill="#0b0b0b">Web dashboard (the digital twin)</text>
    <text x="380" y="426" font-size="11.5" fill="#52514e">map, time slider, confidence, risk panel</text>
  </g>
  <text x="358" y="203" font-size="11.5" text-anchor="middle" fill="#52514e">latest map</text>
  <text x="202" y="316" font-size="11.5" fill="#52514e">current map</text>
</svg>

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sailab"
version = "0.1.0"
description = "SailabAI: a flood digital twin for the Chenab, Ravi and Sutlej rivers around Multan"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SailabAI team" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13",
  "requests>=2.31",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3.9",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# Deep learning. Install torch first from the right index (see README), then this extra.
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
  "xgboost>=2.0",
]
# Vector data, NetCDF and cloud-optimised GeoTIFFs.
geo = [
  "geopandas>=0.14",
  "pyogrio>=0.7",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "rio-cogeo>=5",
]
# Clients for the free data sources. Most need a free account (see docs/data.md).
data = [
  "pystac-client>=0.7",
  "cdsapi>=0.7.2",
  "earthaccess>=0.9",
  "ecmwf-opendata>=0.3",
  "beautifulsoup4>=4.12",
  "pdfplumber>=0.11",
  "asf-search>=7",
  "hyp3-sdk>=6",
  "earthengine-api>=0.1.390",
]
# FastAPI backend, PostGIS and TiTiler map tiles.
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "geoalchemy2>=0.14",
  "psycopg[binary]>=3.1",
  "titiler.core>=0.18",
  "apscheduler>=3.10,<4",
]
# TerraMind-small through TerraTorch (heavy; we mostly run it on Kaggle).
terramind = ["terratorch>=1.0"]
tracking = ["mlflow>=2.12"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "httpx>=0.27",
]
all = ["sailab[ml,geo,data,api,tracking,dev]"]

[project.scripts]
sailab = "sailab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sailab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: long-running tests (training loops)",
  "network: tests that call real external services",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

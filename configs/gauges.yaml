# River gauges and forecast points. Coordinates are approximate: snap each one to the right
# GloFAS river cell before use (first-two-weeks task for the Model 2 owner).
# design_capacity_cusecs is the structure's design flood capacity (as printed in FFD bulletins),
# used for display and for the synthetic demo's breach logic.
# official_lag_hours_to_next is the FFC time-lag chart travel time to the next downstream gauge.
gauges:

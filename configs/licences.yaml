# Licence register (team rules 4 and 5). One entry per dataset we touch.
# Fill download_date and version when you first download. `sailab licences check` validates this file
# and refuses product use of anything that is not commercial-safe.
#
# commercial_safe: true | false | unknown     (unknown blocks product use until someone checks it)
# share_alike: keep as a separate layer, never merged into our own derived layers (OSM rule)
# uses: which of train / test / product we may use it for
datasets:
  - id: sentinel1
    name: Sentinel-1 GRD (Copernicus)
    licence: Copernicus Sentinel data terms (free, full and open)
    licence_url: https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice
    credit: "Contains modified Copernicus Sentinel data [year]"
    commercial_safe: true
    share_alike: false
    uses: [train, test, product]
    version: null
    download_date: null
  - id: gfm
    name: Copernicus GFM flood extent
    licence: Copernicus EMS data policy (free and open, attribution)
    licence_url: https://extwiki.eodc.eu/GFM/PUM/Products
    credit: "Copernicus Emergency Management Service - Global Flood Monitoring (GFM)"
    commercial_safe: true
    share_alike: false
    uses: [train, test, product]
    version: null
    download_date: null
    notes: Product version changed in 2025; pin and save it with every sample.
  - id: imerg
    name: NASA GPM IMERG V07
    licence: NASA open data (no restrictions)
    licence_url: https://gpm.nasa.gov/data/policy
    credit: "NASA/JAXA GPM IMERG"
    commercial_safe: true
    share_alike: false
    uses: [train, test, product]
    version: V07
    download_date: null
    notes: NASA is moving IMERG to V08 during the project.
  - id: ecmwf_open
    name: ECMWF open data (IFS and ENS)
    licence: CC BY 4.0
    licence_url: https://www.ecmwf.int/en/forecasts/datasets/open-data
    credit: "Contains ECMWF open data"
    commercial_safe: true
    share_alike: false
    uses: [train, test, product]
    version: null
    download_date: null
  - id: glofas
    name: GloFAS river discharge (v4.x)
    licence: Copernicus licence (CEMS)
    licence_url: https://ewds.climate.copernicus.eu
    credit: "Copernicus Emergency Management Service - Global Flood Awareness System (GloFAS)"
    commercial_safe: true
    share_alike: false
    uses: [train, test, product]
    version: "4.5"
    download_date: null
    notes: GloFAS v5 is coming; pin versions.
  - id: ffd_bulletins
    name: PMD Flood Forecasting Division bulletins
    licence: Unclear (public government bulletins)
    licence_url: https://ffd.pmd.gov.pk/bulletins/archive
    credit: "Pakistan Meteorological Department, Flood Forecasting Division, Lahore"
    commercial_safe: unknown
    share_alike: false
    uses: [train, test]
    version: null
    download_date: null
    notes: >-
      Bulletins say "All rights reserved; no reproduction without prior written permission".
      Archive for internal research only, never redistribute the PDFs, and get FFD's written
      permission for the data feed before any product use.
  - id: irsa
    name: IRSA daily river flow PDFs
    licence: Unclear (public government PDFs)
    licence_url: null
    credit: "Indus River System Authority"
    commercial_safe: unknown
    share_alike: false
    uses: [train, test]
    version: null
    download_date: null
    notes: Files stay online about 10 days; archive daily.
  - id: viirs_flood
    name: NOAA VIIRS flood products
    licence: US government data (check product page)
    licence_url: null
    credit: "NOAA JPSS VIIRS flood products"
    commercial_safe: unknown
    share_alike: false
    uses: [test]
    version: null
    download_date: null
    notes: Files stay online about 7 days; archive daily.
  - id: cop_dem_glo30
    name: Copernicus DEM GLO-30
    licence: Copernicus DEM licence (free for any use)

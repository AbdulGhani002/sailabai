# Study area: the Trimmu to Panjnad reach, where the Chenab, Jhelum, Ravi and Sutlej meet.
# About 42,000 km2 around Multan. See docs/study_area.md.
name: trimmu-panjnad
description: Trimmu to Panjnad reach around Multan (Chenab, Jhelum, Ravi, Sutlej)

# Geographic box in degrees (EPSG:4326).
bbox:
  west: 70.9
  south: 29.2
  east: 72.7
  north: 31.4

# Optional eastward extension that adds the 2023 Sutlej flood (Ganda Singh Wala to Islam).
extended_east: 74.75
use_extension: false

# Analysis grid. UTM 42N keeps pixels square in metres; the east edge crosses into zone 43,
# which adds well under 0.1% area error at this size.
grid:
  crs: EPSG:32642
  resolution_m: 20          # production grid, ~8,650 x 12,200 pixels
  demo_resolution_m: 400    # synthetic demo grid, fast on a laptop

# Places shown on the dashboard. Coordinates are approximate (to ~1 km).
places:
  - {name: Multan, lat: 30.1575, lon: 71.5249, kind: city}
  - {name: Muzaffargarh, lat: 30.0736, lon: 71.1805, kind: city}
  - {name: Jhang, lat: 31.2681, lon: 72.3181, kind: city}
  - {name: Khanewal, lat: 30.3017, lon: 71.9321, kind: city}
  - {name: Shujabad, lat: 29.8803, lon: 71.2931, kind: town}
  - {name: Jalalpur Pirwala, lat: 29.5051, lon: 71.2224, kind: town}
  - {name: Lodhran, lat: 29.5405, lon: 71.6336, kind: town}
  - {name: Bahawalpur, lat: 29.3956, lon: 71.6836, kind: city}
  - {name: Kabirwala, lat: 30.4053, lon: 71.8662, kind: town}
  - {name: Mailsi, lat: 29.8006, lon: 72.1753, kind: town}
  - {name: Hasilpur, lat: 29.6962, lon: 72.5448, kind: town}
  - {name: Alipur, lat: 29.3817, lon: 70.9114, kind: town}
  - {name: Uch Sharif, lat: 29.2333, lon: 71.0667, kind: town}
  - {name: Shorkot, lat: 30.5000, lon: 72.4000, kind: town}

